name: loginui
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  ionicons: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/line.svg
    - assets/images/light.svg
    - assets/images/victor.jpg
    - assets/images/victor.png
    - assets/images/rec1.svg
    - assets/images/rec2.svg


  fonts:
    - family: Prime
      fonts:
        - asset: assets/fonts/Prime-Light.otf
        - asset: assets/fonts/Prime-Regular.otf
          style: italic
